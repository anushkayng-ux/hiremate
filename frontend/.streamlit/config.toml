[server]
maxUploadSize = 20
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# "Store aisle" theme: aubergine sidebar, cool grey canvas, white panels, till-green actions,
# shelf-tag yellow for the one highlight. Headings Bricolage Grotesque, body Figtree.
[theme]
base = "light"
primaryColor = "#0E7A5C"
backgroundColor = "#F2F3F6"
secondaryBackgroundColor = "#EEEDF3"
textColor = "#1E1B33"
linkColor = "#0B6149"
borderColor = "#E3E2EA"
showWidgetBorder = true
dataframeBorderColor = "#D4D2DE"
dataframeHeaderBackgroundColor = "#EEEDF3"
greenColor = "#0E7A5C"
yellowColor = "#7A4D00"
redColor = "#B42318"
blueColor = "#2B2350"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap, Segoe UI, sans-serif"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,700&display=swap, Figtree, sans-serif"
headingFontWeights = [700, 700, 650, 650, 600, 600]
codeFont = "monospace"
baseFontSize = 14
baseRadius = "10px"
buttonRadius = "10px"

[theme.sidebar]
backgroundColor = "#2B2350"
secondaryBackgroundColor = "#3A3166"
textColor = "#E9E6F5"
primaryColor = "#FFD23F"
borderColor = "#4A4178"
