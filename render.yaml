# Render Blueprint: one free web service built from the Dockerfile.
services:
  - type: web
    name: hiremate
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: JWT_SECRET
        generateValue: true      # long random value made by Render
      - key: GEMINI_API_KEY
        sync: false              # you paste your free key in the Render dashboard
